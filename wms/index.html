<script>
/* Tema dipasang sebelum halaman digambar supaya tidak berkedip putih di malam hari.
   auto = terang 06.00 sampai 18.00, gelap di luar itu. */
(function () {
  var p = 'auto';
  try { p = localStorage.getItem('wms_tema') || 'auto'; } catch (e) {}
  var j = new Date().getHours();
  var t = p === 'light' || p === 'dark' ? p : (j >= 6 && j < 18 ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
