<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F7F8FA">
<link rel="manifest" href="manifest.webmanifest">

<title>WMS Ops</title>
<!-- Aplikasi WMS Ops (19 Okt 2026): surel mitra dan tugas ClickUp di HP Ferdy.
     Server: Edge Function "ops" (Supabase). Masuk memakai kode akses WMS yang sama. -->
<style>
:root{--bg:#F7F8FA;--card:#fff;--ink:#14171C;--mut:#6B7280;--mut2:#9AA1AC;--line:#ECEEF2;--red:#E5484D;--redbg:#FEF0F0;--amb:#E09B12;--ambtx:#A86F00;--ambbg:#FFF7E6;--grn:#2E9E6A;--grnbg:#EAF7F0;--blu:#3E63DD;--blubg:#EEF2FD;--pur:#7C5CDB;--purbg:#F3EFFD;--acc:#F08A4B;--accbg:#FFF4EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;gap:10px}
.hd small{display:block;font-size:12.5px;color:var(--mut);font-weight:500}
.hd h1{margin:0;font-size:23px;letter-spacing:-.5px;font-weight:700}
.av{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#F08A4B,#E5484D);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum>div{border-radius:16px;padding:11px 12px}
.sum b{display:block;font-size:22px;font-weight:700;letter-spacing:-.4px}
.sum span{font-size:11.5px;font-weight:600}
.chips{display:flex;gap:6px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip em{font-style:normal;opacity:.55;margin-left:4px}
.sec{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase;margin:16px 2px 8px}
.c{background:#fff;border-radius:16px;padding:12px;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.05);width:100%;text-align:left}
.ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px}
.c .tt{font-weight:600;font-size:14px;letter-spacing:-.1px;line-height:1.3;display:block}
.c .ss{font-size:12px;color:var(--mut);display:block;margin-top:2px}
.pill{font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:6px;white-space:nowrap}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid #D0D5DD;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.chk.ok{background:var(--grn);border-color:var(--grn);color:#fff}
.chk svg{width:14px;height:14px}
.jb{display:flex;gap:6px;margin-top:8px}.mini{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:10px;background:#F0F2F5}.mini.p{background:var(--ink);color:#fff}
.jdmn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
.jdmn button{font-size:13px;font-weight:600;color:var(--blu);padding:6px 4px}.jdmn b{font-size:15px}
.jdinfo{font-size:12px;color:var(--mut);margin:0 2px 4px}
.jdh{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.jdh.lewat{opacity:.45}.jdh.kini{box-shadow:inset 0 0 0 2px var(--acc)}
.jdt{text-align:center;line-height:1.1}.jdt b{display:block;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase}.jdt span{font-size:19px;font-weight:700}
.jdg{display:flex;flex-wrap:wrap;gap:6px}
.jchip{font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--blubg);color:var(--blu)}
.jchip.TGI{background:#FDEDE4;color:#B4532A}.jchip.MAA{background:var(--purbg);color:var(--pur)}.jchip.KIY{background:var(--grnbg);color:var(--grn)}
.jchip.baru{box-shadow:inset 0 0 0 2px var(--acc)}
.jdkosong{font-size:12px;color:var(--mut2)}
.jdcek{background:var(--ambbg);border-radius:14px;padding:10px 12px;font-size:12.5px;color:#7A5200;margin:10px 0;line-height:1.5}
.jdcek.aman{background:var(--grnbg);color:var(--grn)}
.jdbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;padding:0 12px}
.jdbar>div{max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;font-size:13.5px}
.jdbar button{font-size:13px;font-weight:600;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff}
.jdbar button.p{background:var(--acc)}
.jdhasil{background:#fff;border-radius:16px;padding:14px;margin:6px 0 12px;box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:13.5px}
.jdhasil li{margin:4px 0}
.jdke{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.jdke button{padding:9px 2px;border-radius:11px;background:#F2F4F7;font-size:12.5px;font-weight:600;line-height:1.2}
.jdke button small{display:block;font-weight:500;font-size:10.5px;color:var(--mut)}
.jdke button[disabled]{opacity:.35}
.kosong{text-align:center;color:var(--mut2);font-size:13px;padding:22px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{font-size:11px;font-weight:600;color:var(--mut2);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;position:relative}
.nav svg{width:22px;height:22px}
.nav .on{color:var(--ink)}
.nav i{position:absolute;top:-3px;right:16px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -6px rgba(240,138,75,.7);z-index:4}
.back{font-weight:600;color:var(--blu);margin:2px 0 12px;font-size:14px}
.mt{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin:0}
.meta{font-size:12.5px;color:var(--mut);margin:5px 0 14px}
.bub{background:#fff;border-radius:16px;padding:12px 13px;font-size:13.5px;line-height:1.55;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.05);white-space:pre-wrap;word-wrap:break-word}
.bub .w{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px;display:flex;justify-content:space-between;white-space:normal}
.dr{background:#FFFBF5;border:1.5px dashed #F2C49F}
.dr .w{color:var(--acc)}
.ta{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;min-height:64px;resize:vertical;font-size:14px;margin-bottom:10px}
.ta:focus,.inp:focus{outline:2px solid var(--ink);outline-offset:-1px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{text-align:center;font-weight:600;font-size:14px;padding:13px;border-radius:14px;background:#fff;border:1px solid var(--line);display:block;width:100%;text-decoration:none;color:var(--ink)}
.bt.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt[disabled]{opacity:.45}
.cat{font-size:11.5px;color:var(--mut2);text-align:center;margin-top:10px}
.st{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.st button{flex:1;min-width:70px;text-align:center;font-size:12px;font-weight:600;padding:9px 6px;border-radius:11px;background:#F0F2F5;color:var(--mut);text-transform:capitalize}
.st button.on{background:var(--blubg);color:var(--blu);box-shadow:inset 0 0 0 1.5px var(--blu)}
.bar{height:8px;border-radius:8px;background:#EEF0F3;overflow:hidden;margin:6px 0 6px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:8px}
.ck{display:flex;gap:11px;align-items:center;font-size:14px;padding:8px 0;width:100%;text-align:left}
.tl{border-left:2px solid var(--line);margin:4px 0 0 9px;padding-left:15px}
.tl div{font-size:13px;line-height:1.45;margin-bottom:12px;position:relative;white-space:pre-wrap}
.tl div:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--mut2)}
.tl small{display:block;color:var(--mut2);font-size:11px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mut2);text-transform:uppercase;margin:12px 0 7px}
.kirimbaris{display:flex;gap:8px;margin-top:6px}
.kirimbaris .inp{flex:1}
.inp{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;font-size:15px;background:#fff}
.dim{position:fixed;inset:0;background:rgba(16,24,40,.38);z-index:8;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.on{transform:none}.dim.on{display:block}
.grab{width:40px;height:4px;border-radius:4px;background:#D9DCE1;margin:0 auto 12px}
.sheet h2{font-size:18px;margin:0 0 12px}
.ops{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ops button{font-size:13px;font-weight:500;padding:8px 12px;border-radius:11px;background:#F2F4F7}
.ops button.on{background:var(--ink);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:14px;padding:13px 14px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:10;max-width:528px;margin:0 auto;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{color:#9FE3BE;font-weight:600;white-space:nowrap}
.masuk{max-width:360px;margin:16vh auto 0;text-align:center}
.masuk .av{width:64px;height:64px;border-radius:20px;font-size:28px;margin:0 auto 16px}
.masuk h1{font-size:24px;margin:0 0 6px}
.masuk p{color:var(--mut);font-size:14px;margin:0 0 20px}
.galat{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
.notifbar{display:flex;gap:10px;align-items:center;background:var(--accbg);border-radius:14px;padding:11px 12px;margin-bottom:12px;font-size:13px}
.notifbar b{display:block}
.notifbar button{margin-left:auto;background:var(--acc);color:#fff;font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:10px;white-space:nowrap}
.muat{height:3px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:50% 100%;animation:muat 1s linear infinite;position:fixed;top:0;left:0;right:0;z-index:20;display:none}
.muat.on{display:block}
@keyframes muat{from{background-position:-50% 0}to{background-position:150% 0}}
</style>
</head>
<body>
<div class="muat" id="muat"></div>
<div id="app"></div>
<nav class="nav" id="nav" hidden></nav>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastTeks"></span><button id="toastAksi" hidden></button></div>
<script>
(function () {
  'use strict';
  var OPS = 'https://oloxoxmfbfxxibksxeug.supabase.co/functions/v1/ops';
  var WMS = 'https://oloxoxmfbfxxibksxeug.supabase.co/functions/v1/wms';
  var GAS = 'https://script.google.com/macros/s/AKfycbzslW9akcAS2EINjrdcllgpGpuQzz_I2jHtNyEWixS-yl2HSsqE5kfTDjDGR8H_Zcq9xA/exec';
  var JAM = 3600e3, HARI = 24 * JAM, WIB = 7 * JAM;
  var BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var HR = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

  /* ---------- penyimpanan (kunci sama dengan WMS, jadi masuk sekali berlaku di keduanya) ---------- */
  function ls() { try { return window.localStorage; } catch (e) { return null; } }
  function ambil(k) { try { var a = ls() && ls().getItem(k); if (a === null && window.sessionStorage) a = sessionStorage.getItem(k); return a; } catch (e) { return null; } }
  function taruh(k, v) { try { if (ls()) ls().setItem(k, v); } catch (e) {} }
  function buang(k) { try { if (ls()) ls().removeItem(k); if (window.sessionStorage) sessionStorage.removeItem(k); } catch (e) {} }

  var S = { tiket: ambil('wms_tiket') || '', surel: null, tugas: null, meta: null, rute: '', filter: 'semua', tugasFilter: 'punya', detail: null, sibuk: 0 };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- server ---------- */
  function sibuk(n) { S.sibuk = Math.max(0, S.sibuk + n); $('muat').classList.toggle('on', S.sibuk > 0); }
  function kirimKe(url, badan) {
    sibuk(1);
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(badan), cache: 'no-store', credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (h) { sibuk(-1); return h; }, function (e) { sibuk(-1); throw new Error('Tidak ada sinyal atau server tidak menjawab.'); });
  }
  function api(aksi, data) {
    var b = Object.assign({ aksi: aksi, tiket: S.tiket }, data || {});
    return kirimKe(OPS, b).then(function (h) {
      if (h && h.perluMasuk) { keluar(); throw new Error('Masuk dulu.'); }
      return h || { ok: false, pesan: 'Jawaban server kosong.' };
    });
  }
  /* Apps Script (papan WMS): jalur yang sama dengan WMS, tiket + kata pengganti WMS-TIKET */
  function jalanGas(nama, args) {
    return kirimKe(GAS, { aksi: 'wms', fn: 'panggil', tiket: S.tiket, nama: nama, args: args }).then(function (h) {
      if (!h || typeof h !== 'object' || !h.pintu) throw new Error('Server papan belum menjawab dengan benar. Coba lagi.');
      if (h.pintu === 'galat') throw new Error(h.pesan || 'Server galat.');
      var x = h.hasil;
      if (x && x.perluMasuk) { keluar(); throw new Error('Masuk dulu.'); }
      return x;
    });
  }
  function keluar() { buang('wms_tiket'); buang('wms_ingat'); S.tiket = ''; S.surel = S.tugas = S.meta = null; gambar(); }

  /* ---------- waktu ---------- */
  function wib(ms) { return new Date(Number(ms) + WIB); }
  function kunciHari(ms) { return wib(ms).toISOString().slice(0, 10); }
  function selisihHari(a, b) { return Math.round((Date.parse(kunciHari(b) + 'T00:00:00Z') - Date.parse(kunciHari(a) + 'T00:00:00Z')) / HARI); }
  function tglPanjang(ms) { var d = wib(ms); return HR[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + BLN[d.getUTCMonth()]; }
  function jam(ms) { var d = wib(ms); return ('0' + d.getUTCHours()).slice(-2) + '.' + ('0' + d.getUTCMinutes()).slice(-2); }
  function kapan(ms) {
    if (!ms) return '';
    var s = selisihHari(Date.now(), ms);
    if (s === 0) return 'hari ini'; if (s === 1) return 'besok'; if (s === -1) return 'kemarin';
    var d = wib(ms);
    if (s > 1 && s < 7) return HR[d.getUTCDay()];
    return d.getUTCDate() + ' ' + BLN[d.getUTCMonth()];
  }
  function hariJam(ms) { var d = wib(ms); return HR[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + BLN[d.getUTCMonth()] + ' ' + jam(ms); }
  function agendaJanji(j) { return !!(j.berjam && j.mulai); }
  function kapanJanji(j) { if (!j.mulai) return 'tanpa tenggat'; return agendaJanji(j) ? hariJam(j.mulai) : 'tenggat ' + hariJam(j.mulai).split(' ').slice(0, 3).join(' '); }
  function kartuJanji(j) {
    var ag = agendaJanji(j);
    return '<div class="c" data-janji="' + j.id + '" role="button"><div class="ic" style="background:' + (ag ? 'var(--accbg)' : 'var(--purbg)') + '">' + (ag ? IK.kalender : IK.tugas) + '</div><div><span class="tt">' + esc(j.mitra + ': ' + j.judul) + '</span><span class="ss">' + esc(kapanJanji(j) + (j.pic ? ' · ' + j.pic : '') + (j.lokasi ? ' · ' + j.lokasi : '')) + '</span>' +
      '<div class="jb"><span class="mini p">' + (ag ? 'Jadikan agenda' : 'Jadikan tugas') + '</span><button class="mini" data-abaikan="' + j.id + '">Abaikan</button></div></div><span></span></div>';
  }
  function bagianJanji(daftar) { return daftar.length ? '<div class="sec">Dari surel mitra</div>' + daftar.map(kartuJanji).join('') : ''; }
  function lalu(ms) {
    var m = Math.round((Date.now() - ms) / 60e3);
    if (m < 1) return 'baru saja'; if (m < 60) return m + ' menit lalu';
    if (selisihHari(ms, Date.now()) === 0) return 'tadi ' + jam(ms);
    return kapan(ms) + ' ' + jam(ms);
  }

  /* ---------- ikon ---------- */
  var IK = {
    surel: '<svg viewBox="0 0 24 24" fill="none" stroke="#3E63DD" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    tugas: '<svg viewBox="0 0 24 24" fill="none" stroke="#7C5CDB" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>',
    centang: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L19 7"/></svg>',
    rumah: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    mitra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    kalender: '<svg viewBox="0 0 24 24" fill="none" stroke="#F08A4B" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
    jadwal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
    daftar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>'
  };

  /* ---------- toast ---------- */
  var toastTm = null;
  function toast(teks, aksi, fn) {
    $('toastTeks').textContent = teks;
    var b = $('toastAksi'); b.hidden = !aksi; b.textContent = aksi || ''; b.onclick = function () { $('toast').classList.remove('on'); if (fn) fn(); };
    $('toast').classList.add('on'); clearTimeout(toastTm);
    toastTm = setTimeout(function () { $('toast').classList.remove('on'); }, aksi ? 6000 : 3000);
  }

  /* ---------- data ---------- */
  function muatSemua() {
    if (!S.tiket) return Promise.resolve();
    var a = api('beranda').then(function (h) { if (h.ok) { S.surel = h.surel || { utas: [] }; S.janji = h.janji || []; } });
    var b = api('tugas').then(function (h) { S.tugas = h.ok ? h : { galat: h.pesan || 'Tugas belum terbaca.' }; });

      api('surelKirim', { utas: v.id, draft: v.draft }).then(function (h) { toast(h.pesan || (h.ok ? 'Dikirim.' : 'Gagal.')); if (!h.ok) el.disabled = false; }).catch(function (er) { toast(er.message); el.disabled = false; });
      return;
    }
    if (d.status) {
      var t = S.detail.tugas, lama = t.status; t.status = d.status; gambar();
      api('tugasStatus', { id: t.id, status: d.status }).then(function (h) { if (!h.ok) { t.status = lama; gambar(); toast(h.pesan); } else { toast('Status: ' + d.status); muatSemua(); } });
      return;
    }
    if (d.langkah) {
      var p = d.langkah.split('|'), T2 = S.detail.tugas;
      T2.langkah.daftar.forEach(function (x) { if (x.checklist === p[0] && x.item === p[1]) x.selesai = p[2] === '1'; });
      T2.langkah.selesai = T2.langkah.daftar.filter(function (x) { return x.selesai; }).length; gambar();
      api('tugasLangkah', { id: T2.id, checklist: p[0], item: p[1], selesai: p[2] === '1' }).then(function (h) { if (!h.ok) { toast(h.pesan); muatDetail(T2.id); } });
      return;
    }
    if (d.komentar) {
      var isi = ($('catProgres') || {}).value || ''; if (!isi.trim()) return;
      el.disabled = true;
      api('tugasKomentar', { id: d.komentar, teks: isi }).then(function (h) { el.disabled = false; if (!h.ok) { toast(h.pesan); return; } toast('Catatan tersimpan di ClickUp'); muatDetail(d.komentar); });
      return;
    }
    if ('tambah' in d) { bukaTambah(); return; }
    if (d.opsi) {
      BARU.judul = ($('judulBaru') || {}).value || BARU.judul;
      var q = d.opsi.split('|'), nama = q[0], nilai = q.slice(1).join('|');
      if (nama === 'untuk') { var id = Number(nilai), i = BARU.untuk.indexOf(id); if (i > -1) { if (BARU.untuk.length > 1) BARU.untuk.splice(i, 1); } else BARU.untuk.push(id); }
      else BARU[nama] = nilai;
      gambarTambah(); return;
    }
    if ('simpanbaru' in d) {
      BARU.judul = ($('judulBaru') || {}).value || '';
      var tg = ($('tglBaru') || {}).value; if (tg) BARU.tenggat = tg;
      if (!BARU.judul.trim()) { toast('Judulnya masih kosong.'); return; }
      el.disabled = true;
      api('tugasBaru', BARU).then(function (h) { el.disabled = false; if (!h.ok) { toast(h.pesan); return; } tutupSheet(); toast('Masuk ke ClickUp'); muatSemua(); }).catch(function (er) { el.disabled = false; toast(er.message); });
    }
  });
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'tglBaru' && BARU) { BARU.judul = ($('judulBaru') || {}).value || BARU.judul; BARU.tenggat = e.target.value; gambarTambah(); } });
  $('dim').addEventListener('click', tutupSheet);
  window.addEventListener('hashchange', rute);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.tiket) muatSemua(); });
  setInterval(function () { if (!document.hidden && S.tiket) muatSemua(); }, 90e3);

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw-ops.js', { scope: './' }).catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.segarkan) muatSemua();
      if (e.data && e.data.buka) { var u = new URL(e.data.buka); buka(u.hash || '#beranda'); muatSemua(); }
    });
  }
  window.__ops = { S: S, gambar: gambar, rute: rute };
  rute(); muatSemua();
})();
</script>
